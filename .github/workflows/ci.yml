name: CI

# Every pull request and push to main runs the checks a contributor runs
# locally. The weekly run catches what changes outside this repository - the
# runner images and the python3 and kernel they carry - before a user's host
# does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The oldest Python the package supports, and the python3 each runner
    # image ships, on Linux x86_64 and arm64: the /proc tests skip elsewhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            python: "3.12"
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@ba0d2b16aba47b4c718dd417b2ec337c86d99643 # v0.3.1

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$BASELINE" = success
